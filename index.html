<script>

const STORAGE_KEY = "adamsOptionStateV3";
const HISTORY_KEY = "adamsOptionHistoryV3";

const PAIRS = [
  "EUR/USD",
  "GBP/USD",
  "EUR/GBP",
  "USD/JPY",
  "AUD/USD",
  "USD/CAD",
  "USD/CHF",
  "NZD/USD"
];

let selectedPair = "EUR/USD";
let timeframe = 1;

let currentSignal = "WAIT";
let currentConfidence = 0;

let autoDemo = false;
let openTrade = null;

let autoTimer = null;
let expiryTimer = null;

let balance = 1000;
let wins = 0;
let losses = 0;
let consecutiveLosses = 0;

let history =
JSON.parse(
  localStorage.getItem(HISTORY_KEY) || "[]"
);

const signalEl =
document.getElementById("signal");

const confidenceEl =
document.getElementById("confidence");

const barfill =
document.getElementById("barfill");

const engineStatus =
document.getElementById("engineStatus");


function random(min,max){
  return Math.random() * (max-min) + min;
}


function clamp(v,min,max){
  return Math.max(
    min,
    Math.min(max,v)
  );
}


function pairDecimals(pair){
  return pair.includes("JPY") ? 3 : 5;
}


function basePrice(pair){

  const map = {
    "EUR/USD":1.10500,
    "GBP/USD":1.28500,
    "EUR/GBP":0.86000,
    "USD/JPY":147.200,
    "AUD/USD":0.66500,
    "USD/CAD":1.36500,
    "USD/CHF":0.80500,
    "NZD/USD":0.61500
  };

  return map[pair] || 1;
}


function formatPrice(pair,value){

  return Number(value)
  .toFixed(
    pairDecimals(pair)
  );
}


function saveState(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      balance,
      wins,
      losses,
      consecutiveLosses,
      selectedPair,
      timeframe
    })
  );
}


function loadState(){

  try{

    const s =
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "null"
    );

    if(!s) return;

    if(Number.isFinite(s.balance)){
      balance = s.balance;
    }

    if(Number.isFinite(s.wins)){
      wins = s.wins;
    }

    if(Number.isFinite(s.losses)){
      losses = s.losses;
    }

    if(Number.isFinite(s.consecutiveLosses)){
      consecutiveLosses =
      s.consecutiveLosses;
    }

    if(s.selectedPair){
      selectedPair =
      s.selectedPair;
    }

    if(
      [1,5,15]
      .includes(
        Number(s.timeframe)
      )
    ){
      timeframe =
      Number(s.timeframe);
    }

  }catch(e){}
}


/* =========================================
   SIGNAL ENGINE
   Creează un semnal separat pentru fiecare
   pereche scanată.
========================================= */

function analysePair(pair){

  const momentum =
  random(-100,100);

  const trend =
  random(-100,100);

  const strength =
  random(0,100);

  const volatility =
  random(15,100);


  const score =
    momentum * 0.42 +
    trend * 0.38 +
    (strength-50) * 0.14 +
    (volatility-50) * 0.06;


  let direction = "WAIT";


  if(score > 20){

    direction = "CALL";

  }
  else if(score < -20){

    direction = "PUT";

  }


  let confidence;


  if(direction === "WAIT"){

    confidence =
    Math.round(
      random(50,74)
    );

  }
  else{

    confidence =
    Math.round(
      clamp(
        60 +
        Math.abs(score) * 0.38 +
        random(-5,7),
        55,
        96
      )
    );

  }


  return {
    pair,
    direction,
    confidence,
    score,
    momentum,
    trend,
    strength,
    volatility
  };
}


/* =========================================
   MANUAL ANALYSIS
========================================= */

function analyseMarket(){

  if(openTrade){
    return;
  }

  const result =
  analysePair(selectedPair);

  currentSignal =
  result.direction;

  currentConfidence =
  result.confidence;

  renderSignal();

  engineStatus.textContent =
  selectedPair +
  " analysed manually";
}


/* =========================================
   AUTO SCANNER
   SCANEAZĂ TOATE PERECHILE
========================================= */

function autoScanMarket(){

  if(!autoDemo || openTrade){
    return;
  }


  const maxLoss =
  Number(
    document.getElementById(
      "maxLosses"
    ).value
  ) || 2;


  if(
    consecutiveLosses >=
    maxLoss
  ){

    stopAuto(
      "Stopped: maximum consecutive losses reached."
    );

    return;
  }


  engineStatus.textContent =
  "AUTO scanning all 8 Forex pairs…";


  const results =
  PAIRS.map(
    pair => analysePair(pair)
  );


  const tradeSignals =
  results.filter(
    r => r.direction !== "WAIT"
  );


  if(tradeSignals.length === 0){

    currentSignal = "WAIT";
    currentConfidence = 0;

    renderSignal();

    engineStatus.textContent =
    "No valid signal. Scanning again in 5 seconds…";

    scheduleNextScan();

    return;
  }


  tradeSignals.sort(
    (a,b) =>
    b.confidence -
    a.confidence
  );


  const best =
  tradeSignals[0];


  selectedPair =
  best.pair;

  currentSignal =
  best.direction;

  currentConfidence =
  best.confidence;


  highlightSelectedPair();

  renderSignal();


  const minConfidence =
  Number(
    document.getElementById(
      "minConfidence"
    ).value
  ) || 80;


  engineStatus.textContent =
  "BEST: " +
  best.pair +
  " • " +
  best.direction +
  " • " +
  best.confidence +
  "%";


  if(
    best.confidence >=
    minConfidence
  ){

    openDemoTrade();

  }
  else{

    engineStatus.textContent =
    "Best: " +
    best.pair +
    " " +
    best.direction +
    " " +
    best.confidence +
    "% • Need " +
    minConfidence +
    "%";


    scheduleNextScan();

  }

}


/* =========================================
   SELECT AUTO PAIR VISUALLY
========================================= */

function highlightSelectedPair(){

  document
  .querySelectorAll(".asset")
  .forEach(btn => {

    btn.classList.toggle(
      "active",
      btn.dataset.pair ===
      selectedPair
    );

  });

}


/* =========================================
   SIGNAL DISPLAY
========================================= */

function renderSignal(){

  signalEl.textContent =
  currentSignal;


  signalEl.className =
  "signal " +
  (
    currentSignal === "CALL"
    ? "call"
    :
    currentSignal === "PUT"
    ? "put"
    :
    "wait"
  );


  confidenceEl.textContent =
  currentConfidence + "%";


  barfill.style.width =
  currentConfidence + "%";


  barfill.style.background =
  currentSignal === "PUT"
  ? "var(--red)"
  :
  currentSignal === "WAIT"
  ? "var(--gold)"
  :
  "var(--green)";
}


/* =========================================
   RISK
========================================= */

function getTradeAmount(){

  const risk =
  Number(
    document
    .getElementById(
      "riskInput"
    )
    .value
  ) || 1;


  return Math.min(
    balance,
    Math.max(
      .5,
      balance *
      risk /
      100
    )
  );
}


/* =========================================
   OPEN AUTO DEMO TRADE
========================================= */

function openDemoTrade(){

  clearTimeout(autoTimer);


  if(openTrade){
    return;
  }


  const amount =
  getTradeAmount();


  if(
    amount <= 0 ||
    balance <= 0
  ){

    stopAuto(
      "Stopped: demo balance is empty."
    );

    return;
  }


  const entry =
  basePrice(selectedPair)
  +
  random(
    -0.0015,
    0.0015
  )
  *
  (
    selectedPair.includes("JPY")
    ? 100
    : 1
  );


  const expirySeconds =
  timeframe * 60;


  openTrade = {

    pair:
    selectedPair,

    direction:
    currentSignal,

    confidence:
    currentConfidence,

    amount,

    expirySeconds,

    remaining:
    expirySeconds,

    opened:
    Date.now(),

    entry,

    price:
    entry

  };


  engineStatus.textContent =
  "AUTO TRADE: " +
  selectedPair +
  " " +
  currentSignal +
  " " +
  currentConfidence +
  "%";


  renderOpenTrade();

  startExpiry();
}


/* =========================================
   OPEN TRADE DISPLAY
========================================= */

function renderOpenTrade(){

  const card =
  document.getElementById(
    "openTradeCard"
  );


  if(!openTrade){

    card.style.display =
    "none";

    return;
  }


  card.style.display =
  "block";


  document
  .getElementById(
    "openPair"
  )
  .textContent =
  openTrade.pair;


  const dir =
  document.getElementById(
    "openDirection"
  );


  dir.textContent =
  openTrade.direction;


  dir.className =
  "badge " +
  (
    openTrade.direction ===
    "CALL"
    ? "call"
    : "put"
  );


  document
  .getElementById(
    "openAmount"
  )
  .textContent =
  "£" +
  openTrade.amount.toFixed(2);


  document
  .getElementById(
    "openExpiry"
  )
  .textContent =
  timeframe +
  (
    timeframe === 1
    ? " minute"
    : " minutes"
  );


  document
  .getElementById(
    "openConfidence"
  )
  .textContent =
  openTrade.confidence +
  "%";


  document
  .getElementById(
    "openEntry"
  )
  .textContent =
  formatPrice(
    openTrade.pair,
    openTrade.entry
  );


  document
  .getElementById(
    "openPrice"
  )
  .textContent =
  formatPrice(
    openTrade.pair,
    openTrade.price
  );


  document
  .getElementById(
    "countdown"
  )
  .textContent =
  formatTime(
    openTrade.remaining
  );
}


/* =========================================
   DEMO PRICE ENGINE
========================================= */

function startExpiry(){

  clearInterval(
    expiryTimer
  );


  expiryTimer =
  setInterval(
  ()=>{


    if(!openTrade){

      clearInterval(
        expiryTimer
      );

      return;
    }


    const scale =
    openTrade.pair
    .includes("JPY")
    ? 0.012
    : 0.00012;


    const directionalBias =
    (
      openTrade.confidence -
      50
    )
    /
    50
    *
    scale
    *
    (
      openTrade.direction ===
      "CALL"
      ? 0.16
      : -0.16
    );


    openTrade.price +=
    random(
      -scale,
      scale
    )
    +
    directionalBias;


    openTrade.remaining--;


    renderOpenTrade();


    if(
      openTrade.remaining <= 0
    ){

      clearInterval(
        expiryTimer
      );

      closeDemoTrade();

    }


  },1000);
}


function formatTime(seconds){

  const m =
  Math.floor(
    seconds / 60
  );

  const s =
  seconds % 60;


  return (
    String(m)
    .padStart(2,"0")
    +
    ":"
    +
    String(s)
    .padStart(2,"0")
  );
}


/* =========================================
   CLOSE TRADE
========================================= */

function closeDemoTrade(){

  if(!openTrade){
    return;
  }


  const trade =
  openTrade;


  const movedUp =
  trade.price >
  trade.entry;


  const movedDown =
  trade.price <
  trade.entry;


  let result =
  "DRAW";


  if(
    trade.direction ===
    "CALL"
    &&
    movedUp
  ){

    result = "WIN";

  }


  if(
    trade.direction ===
    "CALL"
    &&
    movedDown
  ){

    result = "LOSS";

  }


  if(
    trade.direction ===
    "PUT"
    &&
    movedDown
  ){

    result = "WIN";

  }


  if(
    trade.direction ===
    "PUT"
    &&
    movedUp
  ){

    result = "LOSS";

  }


  const payout = .82;

  let profit = 0;


  if(result === "WIN"){

    profit =
    trade.amount *
    payout;

    balance += profit;

    wins++;

    consecutiveLosses = 0;

  }
  else if(result === "LOSS"){

    profit =
    -trade.amount;

    balance -=
    trade.amount;

    losses++;

    consecutiveLosses++;

  }


  saveHistory(
    trade,
    result,
    profit
  );


  openTrade = null;


  document
  .getElementById(
    "openTradeCard"
  )
  .style.display =
  "none";


  updateStats();

  saveState();


  if(autoDemo){

    const maxLoss =
    Number(
      document
      .getElementById(
        "maxLosses"
      )
      .value
    ) || 2;


    if(
      consecutiveLosses >=
      maxLoss
    ){

      stopAuto(
        "AUTO stopped after loss limit."
      );

      return;
    }


    engineStatus.textContent =
    result +
    " • Scanning all pairs again in 5 seconds…";


    scheduleNextScan();

  }

}


/* =========================================
   HISTORY
========================================= */

function saveHistory(
trade,
result,
profit
){

  history.unshift({

    pair:
    trade.pair,

    direction:
    trade.direction,

    confidence:
    trade.confidence,

    amount:
    trade.amount,

    entry:
    trade.entry,

    close:
    trade.price,

    result,

    profit,

    time:
    new Date()
    .toLocaleString()

  });


  history =
  history.slice(
    0,
    100
  );


  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(
      history
    )
  );


  renderHistory();
}


function renderHistory(){

  const box =
  document.getElementById(
    "history"
  );


  if(history.length === 0){

    box.innerHTML =
    '<div class="empty">No demo trades yet.</div>';

    return;
  }


  box.innerHTML =
  history.map(
  t=>{


    const resultClass =
    t.result === "WIN"
    ? "win"
    :
    t.result === "LOSS"
    ? "loss"
    :
    "draw";


    const profitText =
    (
      t.profit > 0
      ? "+"
      :
      t.profit < 0
      ? "-"
      :
      ""
    )
    +
    "£"
    +
    Math.abs(
      t.profit || 0
    )
    .toFixed(2);


    return `

    <div class="historyItem">

      <div>

        <strong>
          ${t.pair}
        </strong>

        <br>

        <span style="color:#748178;font-size:9px">
          ${t.time}
        </span>

      </div>

      <div class="${
        t.direction === "CALL"
        ? "call"
        : "put"
      }">

        ${t.direction}

      </div>

      <div>
        ${t.confidence}%
      </div>

      <div class="${resultClass}">

        ${t.result}

        <br>

        ${profitText}

      </div>

    </div>

    `;

  })
  .join("");
}


/* =========================================
   STATISTICS
========================================= */

function updateStats(){

  document
  .getElementById(
    "balance"
  )
  .textContent =
  "£" +
  balance.toFixed(2);


  document
  .getElementById(
    "wins"
  )
  .textContent =
  wins;


  document
  .getElementById(
    "losses"
  )
  .textContent =
  losses;


  const total =
  wins + losses;


  document
  .getElementById(
    "tradesCount"
  )
  .textContent =
  total;


  document
  .getElementById(
    "winrate"
  )
  .textContent =
  total
  ?
  Math.round(
    wins /
    total *
    100
  ) + "%"
  :
  "0%";


  document
  .getElementById(
    "lossStreak"
  )
  .textContent =
  consecutiveLosses;


  document
  .getElementById(
    "balanceInput"
  )
  .value =
  balance.toFixed(2);
}


/* =========================================
   AUTO BUTTON
========================================= */

function updateAutoButton(){

  const btn =
  document.getElementById(
    "autoBtn"
  );


  if(autoDemo){

    btn.textContent =
    "AUTO DEMO: ON";

    btn.className =
    "btn autoOn";

  }
  else{

    btn.textContent =
    "AUTO DEMO: OFF";

    btn.className =
    "btn autoOff";

  }
}


/* =========================================
   NEXT AUTOMATIC SCAN
========================================= */

function scheduleNextScan(){

  clearTimeout(
    autoTimer
  );


  if(
    !autoDemo ||
    openTrade
  ){
    return;
  }


  autoTimer =
  setTimeout(
  ()=>{

    if(
      autoDemo &&
      !openTrade
    ){

      autoScanMarket();

    }

  },5000);
}


function stopAuto(message){

  autoDemo = false;

  clearTimeout(
    autoTimer
  );

  updateAutoButton();

  engineStatus.textContent =
  message ||
  "AUTO DEMO off";
}


/* =========================================
   MANUAL PAIR BUTTONS
========================================= */

document
.querySelectorAll(
  ".asset"
)
.forEach(
btn=>{


  btn.onclick =
  ()=>{


    if(openTrade){
      return;
    }


    document
    .querySelectorAll(
      ".asset"
    )
    .forEach(
    b=>
      b.classList
      .remove(
        "active"
      )
    );


    btn.classList.add(
      "active"
    );


    selectedPair =
    btn.dataset.pair;


    currentSignal =
    "WAIT";

    currentConfidence =
    0;


    renderSignal();

    saveState();

  };

});


/* =========================================
   TIMEFRAME BUTTONS
========================================= */

document
.querySelectorAll(
  ".tf"
)
.forEach(
btn=>{


  btn.onclick =
  ()=>{


    if(openTrade){
      return;
    }


    document
    .querySelectorAll(
      ".tf"
    )
    .forEach(
    b=>
      b.classList
      .remove(
        "active"
      )
    );


    btn.classList.add(
      "active"
    );


    timeframe =
    Number(
      btn.dataset.tf
    );


    saveState();

  };

});


/* =========================================
   ANALYSE MANUAL
========================================= */

document
.getElementById(
  "analyseBtn"
)
.onclick =
analyseMarket;


/* =========================================
   AUTO ON/OFF
========================================= */

document
.getElementById(
  "autoBtn"
)
.onclick =
()=>{


  autoDemo =
  !autoDemo;


  updateAutoButton();


  if(autoDemo){

    engineStatus.textContent =
    "AUTO scanning all Forex pairs…";


    autoScanMarket();

  }
  else{

    clearTimeout(
      autoTimer
    );


    engineStatus.textContent =
    openTrade
    ?
    "AUTO off; open demo trade will finish."
    :
    "AUTO DEMO off";

  }

};


/* =========================================
   BALANCE
========================================= */

document
.getElementById(
  "balanceInput"
)
.onchange =
()=>{


  if(openTrade){

    document
    .getElementById(
      "balanceInput"
    )
    .value =
    balance.toFixed(2);


    alert(
      "Wait until the open demo trade finishes before changing balance."
    );


    return;
  }


  const value =
  Number(
    document
    .getElementById(
      "balanceInput"
    )
    .value
  );


  if(value > 0){

    balance = value;

    updateStats();

    saveState();

  }

};


/* =========================================
   CLEAR HISTORY
========================================= */

document
.getElementById(
  "clearHistory"
)
.onclick =
()=>{


  if(
    confirm(
      "Clear all demo trade history and statistics?"
    )
  ){

    history = [];

    localStorage
    .removeItem(
      HISTORY_KEY
    );


    wins = 0;

    losses = 0;

    consecutiveLosses = 0;


    renderHistory();

    updateStats();

    saveState();

  }

};


/* =========================================
   NAVIGATION
========================================= */

document
.querySelectorAll(
  ".nav"
)
.forEach(
btn=>{


  btn.onclick =
  ()=>{


    document
    .querySelectorAll(
      ".nav"
    )
    .forEach(
    b=>
      b.classList
      .remove(
        "active"
      )
    );


    btn.classList.add(
      "active"
    );


    document
    .querySelectorAll(
      ".screen"
    )
    .forEach(
    s=>
      s.classList
      .remove(
        "active"
      )
    );


    document
    .getElementById(
      btn.dataset.screen
    )
    .classList
    .add(
      "active"
    );

  };

});


/* =========================================
   START APP
========================================= */

loadState();

highlightSelectedPair();


document
.querySelectorAll(
  ".tf"
)
.forEach(
b=>{

  b.classList.toggle(

    "active",

    Number(
      b.dataset.tf
    ) ===
    timeframe

  );

});


renderSignal();

renderHistory();

updateStats();

updateAutoButton();

    </script>
